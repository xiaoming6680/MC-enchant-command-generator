<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MC附魔指令生成器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">
        <span class="brand-block brand-block-book"></span>
        <span class="brand-block brand-block-lapis"></span>
        <span class="brand-block brand-block-obsidian"></span>
      </div>
      <div class="brand-copy">
        <p class="eyebrow">Minecraft Java Edition</p>
        <h1>附魔指令生成器</h1>
        <p class="subtitle">为不同 Java 版本生成对应格式的 /give 附魔物品指令</p>
      </div>
    </header>

    <div class="workspace">
      <div class="editor-column">
        <section class="panel settings-panel">
          <div class="panel-header">
            <div>
              <p class="section-label">设置</p>
              <h2>指令与目标</h2>
            </div>
          </div>

          <div class="field-grid settings-grid">
            <label class="field">
              <span>选择 Minecraft Java 版本</span>
              <select id="versionSelect">
                <option value="componentShort" selected>Java 1.21.5+</option>
                <option value="componentLevels">Java 1.20.5 - 1.21.4</option>
                <option value="nbtString">Java 1.13 - 1.20.4</option>
                <option value="nbtNumeric">Java 1.8 - 1.12.2</option>
              </select>
            </label>
            <label class="field">
              <span>目标玩家</span>
              <div id="targetCombobox" class="combobox"></div>
            </label>

            <p id="versionDescription" class="field-help">新版物品组件简化格式</p>
          </div>
        </section>

        <section class="panel item-panel">
          <div class="panel-header">
            <div>
              <p class="section-label">物品</p>
              <h2>武器或工具</h2>
            </div>
            <a class="button secondary lookup-button" href="https://mcid.lingningyu.cn/" target="_blank" rel="noopener noreferrer">查询物品 ID</a>
          </div>

          <div class="field-grid item-fields">
            <label class="field item-id-field">
              <span>物品 ID</span>
              <div id="itemCombobox" class="combobox"></div>
            </label>
            <label class="field quantity-field">
              <span>数量</span>
              <input id="itemCountInput" type="text" inputmode="numeric" min="1" value="1" placeholder="1">
            </label>
          </div>
        </section>

        <section class="panel enchant-panel">
          <div class="panel-header action-header">
            <div>
              <p class="section-label">附魔</p>
              <h2>附魔列表</h2>
            </div>

            <div class="button-row">
              <span id="enchantmentCount" class="count-badge" aria-live="polite">0 条附魔</span>
              <button id="addEnchantmentButton" class="button primary" type="button">新增附魔</button>
              <button id="clearEnchantmentsButton" class="button secondary" type="button">清空</button>
              <button id="resetButton" class="button secondary" type="button">重置</button>
            </div>
          </div>

          <div class="enchant-table-header" aria-hidden="true">
            <span>附魔属性</span>
            <span>等级</span>
            <span>操作</span>
          </div>

          <div id="enchantmentList" class="enchantment-list"></div>
        </section>
      </div>

      <aside class="result-column">
        <section class="panel output-panel">
          <div class="panel-header">
            <div>
              <p class="section-label">结果</p>
              <h2>指令预览</h2>
            </div>
          </div>

          <div class="command-meta" aria-label="当前指令概要">
            <div class="meta-pill">
              <span>版本</span>
              <strong id="versionMeta">Java 1.21.5+</strong>
            </div>
            <div class="meta-pill">
              <span>目标</span>
              <strong id="targetMeta">未填写</strong>
            </div>
            <div class="meta-pill">
              <span>物品</span>
              <strong id="itemMeta">未填写</strong>
            </div>
            <div class="meta-pill">
              <span>附魔</span>
              <strong id="enchantMeta">0 条</strong>
            </div>
          </div>

          <pre id="commandPreview" class="command-preview" aria-live="polite"></pre>
          <div id="errorBox" class="error-box" role="alert" aria-live="polite"></div>

          <div class="copy-actions">
            <button id="copyButton" class="button primary copy-button" type="button">复制指令</button>
            <span id="copyStatus" class="copy-status" role="status" aria-live="polite"></span>
          </div>
        </section>
      </aside>
    </div>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
